name: Build release zips

on:
  push:
    tags:
      # Version tags like 1.3.0.14, 1.3.0.14-01, v1.3.0.14, v1.3.0.14-01
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: sws-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release zips
    runs-on: ubuntu-latest
    environment: plugin-releases

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: metadata
        run: |
          RAW="${GITHUB_REF_NAME}"
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+(\.[0-9]+){2,3}(-[0-9]{2})?$'; then
            echo "Expected stable release tag [v]X.Y.Z[.W][-NN]" >&2
            exit 1
          fi
          VERSION="${RAW#v}"        # strip leading "v"
          VERSION="${VERSION%-*}"   # strip "-01" build suffix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          HEADER="$(grep -m1 -E '^\s*\*?\s*Version:' sw-sliderman.php | awk '{print $NF}' | tr -d '\r')"
          CONSTANT="$(grep -m1 "define( 'SWS_VERSION'" sw-sliderman.php | sed -E "s/.*'([0-9.]+)'.*/\1/")"
          echo "tag=$VERSION header=$HEADER constant=$CONSTANT"
          if [ "$VERSION" != "$HEADER" ] || [ "$VERSION" != "$CONSTANT" ]; then
            echo "Tag, plugin header and SWS_VERSION must be identical" >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          extensions: zip, mbstring, fileinfo, openssl, mysqli, sodium
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dev tools
        run: composer install --no-interaction --no-progress

      - name: Embed public verification key
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php public-key includes/update/trusted-keys.php

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build ZIPs
        run: bash bin/build-zip.sh "$RUNNER_TEMP/dist"

      - name: Verify ZIP contents and embedded public key
        env:
          KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: |
          ZIP="$RUNNER_TEMP/dist/sw-sliderman-${{ steps.metadata.outputs.version }}.zip"
          unzip -t "$ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/package"
          php tests/package-smoke.php "$RUNNER_TEMP/package/sw-sliderman"
          unzip -Z1 "$ZIP" > "$RUNNER_TEMP/contents.txt"
          if grep -Eq '^sw-sliderman/(assets|tests|bin|node_modules|coverage|\.git|\.github)/|^sw-sliderman/vendor/(phpunit|phpstan|squizlabs|wp-coding-standards)/' "$RUNNER_TEMP/contents.txt"; then
            echo 'Unexpected development files in package' >&2
            exit 1
          fi
          php -r '$expected=require $argv[1]; $shipped=require $argv[2]; $id=getenv("KEY_ID"); exit(isset($expected[$id],$shipped[$id]) && $expected[$id]===$shipped[$id] ? 0 : 1);' includes/update/trusted-keys.php "$RUNNER_TEMP/package/sw-sliderman/includes/update/trusted-keys.php"

      - name: Upload packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            php -r '$r=json_decode(file_get_contents($argv[1]),true); exit(empty($r["isDraft"])?1:0);' "$RUNNER_TEMP/existing-release.json" \
              || { echo "Release $RELEASE_TAG is already published; refusing to modify it." >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/dist/*.zip --clobber
          # Resolve drafts via gh release view; the tag endpoint does not resolve them.
          RELEASE_API_URL="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$RELEASE_API_URL" > "$RUNNER_TEMP/release.json"

      - name: Sign exact uploaded packages
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php sign "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/dist" "$GITHUB_SHA"

      - name: Verify signed artifacts with runtime code
        run: php bin/verify-release.php "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release.json" includes/update/trusted-keys.php

      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/prepublish.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true); exit(($r["isDraft"] ?? false) === true ? 0 : 1);' "$RUNNER_TEMP/prepublish.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/dist/sw-plugin-release.json" "$RUNNER_TEMP/dist/sw-plugin-release.json.sig" --clobber
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/downloaded"
          RELEASE_API_URL="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$RELEASE_API_URL" > "$RUNNER_TEMP/uploaded-release.json"
          php bin/verify-release.php "$RUNNER_TEMP/downloaded" "$RUNNER_TEMP/uploaded-release.json" includes/update/trusted-keys.php
          gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/prepublish.json"
          php -r '$r=json_decode(file_get_contents($argv[1]),true); exit(($r["isDraft"] ?? false) === true ? 0 : 1);' "$RUNNER_TEMP/prepublish.json"
          gh release edit "$RELEASE_TAG" --draft=false
